# Intégration continue — voir CLAUDE.md §10.
#
# Trois travaux indépendants, pour que la cause d'un rouge se lise sans ouvrir
# les journaux : la qualité (lint + types + tests), les parcours critiques, et
# la construction de l'image Docker déployée par Coolify.
name: CI

on:
  push:
  pull_request:

# Une nouvelle poussée annule la précédente sur la même branche : inutile de
# payer deux fois le même build.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `prisma generate` tourne en postinstall et lit DATABASE_URL via
  # prisma.config.ts : sans elle, `npm ci` échoue avant le premier test.
  # Aucune base n'est créée ici — le chemin suffit à générer le client.
  DATABASE_URL: file:./prisma/ci.db
  TZ: Europe/Paris
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, types et tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: Parcours critiques (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium seul : c'est le seul projet déclaré dans playwright.config.ts.
      - run: npx playwright install --with-deps chromium
      # scripts/e2e-server.mjs construit la sortie standalone et démarre le
      # serveur sur sa propre base SQLite, dans .e2e-run/ : rien à provisionner.
      - run: npm run e2e
      # Le rapport HTML porte les traces des parcours tombés : sans lui, un
      # rouge distant n'est qu'un nom de test.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Construction seule, sans publication : c'est le seul moyen d'attraper
      # une régression du Dockerfile avant le déploiement Coolify.
      - run: docker build --tag freelance-dashboard:ci .
